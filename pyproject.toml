[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genesis-arena"
version = "0.2.0"
description = "WorldEval orchestration backend for the deterministic WorldArena agent platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.24.1,<4.26",
  "openai>=1.68,<3",
  "pillow==11.3.0",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
benchmark = [
  "matplotlib>=3.9,<4",
]

[project.scripts]
genesis-arena = "genesis_arena.main:run"
genesis-evaluate = "genesis_arena.evaluation:main"
genesis-season-schedule = "genesis_arena.season_cli:main"
genesis-labyrinth-benchmark = "genesis_arena.embodiment.labyrinth_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/genesis_arena"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_provider: opt-in external provider smoke test requiring explicit key and model env vars",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]
